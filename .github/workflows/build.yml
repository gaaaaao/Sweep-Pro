name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The module-owned workflow applies its version-matched ZMK compatibility
    # patch before building. Pinning it keeps the module and build procedure in sync.
    uses: nxtkb/zmk-feature-codex-micro/.github/workflows/build-user-config.yml@034050c6cac7834b5004aad510863e7c999f6307
    with:
      build_matrix_path: build.yaml
      archive_name: sweep-pro-firmware
